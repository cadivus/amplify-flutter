name: Release

on:
  push:
    branches: [main, feat/ci/release]
    paths:
      - '**/pubspec.yaml'

# IMPORTANT: Never cancel a release in progress. Queue subsequent runs.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

jobs:
  start-runner:
    name: Start self-hosted EC2 runner
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.start.outputs.label }}
      ec2-instance-id: ${{ steps.start.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.RELEASE_RUNNER_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.RELEASE_RUNNER_AWS_REGION }}

      - name: Start EC2 runner
        id: start
        env:
          GH_TOKEN: ${{ secrets.RELEASE_RUNNER_GH_PERSONAL_ACCESS_TOKEN }}
          REPO: ${{ github.repository }}
          EC2_IMAGE_ID: ami-07a00cf47dbbc844c
          EC2_INSTANCE_TYPE: t3a.medium
          SUBNET_ID: ${{ secrets.RELEASE_RUNNER_EC2_SUBNET_ID }}
          SECURITY_GROUP_ID: ${{ secrets.RELEASE_RUNNER_EC2_SECURITY_GROUP_ID }}
        run: |
          set -euo pipefail

          # Generate a unique label for this runner
          LABEL="release-$(head -c 4 /dev/urandom | xxd -p)"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "Runner label: $LABEL"

          # Get a registration token from GitHub
          REG_TOKEN=$(curl -sf \
            -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/runners/registration-token" \
            | jq -r '.token')

          if [ -z "$REG_TOKEN" ] || [ "$REG_TOKEN" = "null" ]; then
            echo "::error::Failed to get runner registration token"
            exit 1
          fi

          # Build user-data script for EC2 instance
          USER_DATA=$(cat <<'OUTER'
          #!/bin/bash
          set -e

          # Install dependencies
          apt-get update -y
          apt-get install -y git libicu-dev curl xz-utils clang cmake ninja-build pkg-config libgtk-3-dev jq

          # Create runner directory and download latest runner
          mkdir -p /home/ubuntu/actions-runner && cd /home/ubuntu/actions-runner
          case $(uname -m) in aarch64) ARCH="arm64" ;; amd64|x86_64) ARCH="x64" ;; esac
          RUNNER_VERSION=$(curl -sf "https://api.github.com/repos/actions/runner/releases/latest" | jq -r '.tag_name' | tr -d 'v')
          curl -sL "https://github.com/actions/runner/releases/download/v${RUNNER_VERSION}/actions-runner-linux-${ARCH}-${RUNNER_VERSION}.tar.gz" | tar xz

          # Configure and start the runner
          chown -R ubuntu:ubuntu /home/ubuntu/actions-runner
          OUTER
          )

          # Append the secrets (these can't go in a heredoc with single quotes)
          USER_DATA="${USER_DATA}
          runuser -u ubuntu -- ./config.sh --unattended --url https://github.com/${REPO} --token ${REG_TOKEN} --labels ${LABEL} --name ec2-${LABEL} --replace
          runuser -u ubuntu -- ./run.sh"

          # Launch EC2 instance
          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id "$EC2_IMAGE_ID" \
            --instance-type "$EC2_INSTANCE_TYPE" \
            --subnet-id "$SUBNET_ID" \
            --security-group-ids "$SECURITY_GROUP_ID" \
            --block-device-mappings '[{"DeviceName":"/dev/sda1","Ebs":{"VolumeSize":50}}]' \
            --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=github-actions-runner},{Key=GitHubRepository,Value=${REPO}},{Key=Purpose,Value=release}]" \
            --user-data "$USER_DATA" \
            --query 'Instances[0].InstanceId' \
            --output text)

          echo "ec2-instance-id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "Launched EC2 instance: $INSTANCE_ID"

          # Wait for runner to register with GitHub
          echo "Waiting for runner to register (label: $LABEL)..."
          for i in $(seq 1 60); do
            sleep 10
            RUNNER_STATUS=$(curl -sf \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/runners" \
              | jq -r ".runners[] | select(.labels[]?.name == \"$LABEL\") | .status" || true)

            if [ "$RUNNER_STATUS" = "online" ]; then
              echo "Runner is online!"
              exit 0
            fi
            echo "  Attempt $i/60 — runner not yet online (status: ${RUNNER_STATUS:-not found})"
          done

          echo "::error::Runner did not come online within 10 minutes"
          aws ec2 terminate-instances --instance-ids "$INSTANCE_ID" || true
          exit 1

  release:
    name: Release packages
    needs: start-runner
    runs-on: ${{ needs.start-runner.outputs.label }}
    steps:
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create publishing token (pub.dev)
        run: |
          set -eo pipefail
          PUB_TOKEN=$(curl --retry 5 --retry-connrefused -sLS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://pub.dev" -H "User-Agent: actions/oidc-client" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r '.value')
          echo "PUB_TOKEN=${PUB_TOKEN}" >> $GITHUB_ENV
          export PUB_TOKEN
          flutter pub token add https://pub.dev --env-var PUB_TOKEN

      - name: Install aft
        run: dart pub global activate -spath packages/aft

      - name: Check for new tags
        id: check-tags
        run: |
          aft publish --tags 2>&1 | tee "$RUNNER_TEMP/tags_output.txt"
          TAGS=$(grep "^New tag:" "$RUNNER_TEMP/tags_output.txt" | sed 's/^New tag: //' || true)
          if [ -z "$TAGS" ]; then
            echo "No new tags to create. Nothing to release."
            echo "has_tags=false" >> "$GITHUB_OUTPUT"
          else
            echo "New tags found:"
            echo "$TAGS"
            echo "has_tags=true" >> "$GITHUB_OUTPUT"
            echo "$TAGS" > "$RUNNER_TEMP/new_tags.txt"
          fi

      - name: Verify publish (pre-tag dry run)
        if: steps.check-tags.outputs.has_tags == 'true'
        run: aft publish --dry-run --force

      - name: Install GitHub CLI
        if: steps.check-tags.outputs.has_tags == 'true'
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update -y
          sudo apt-get install -y gh

      - name: Create and push tags
        if: steps.check-tags.outputs.has_tags == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          while IFS= read -r tag; do
            echo "Creating tag: $tag"
            git tag "$tag"
          done < "$RUNNER_TEMP/new_tags.txt"
          git push origin --tags

      - name: Verify publish (post-tag dry run - make non-dry-run before merging this workflow)
        if: steps.check-tags.outputs.has_tags == 'true'
        run: aft publish --dry-run --force

      - name: Create GitHub releases
        if: steps.check-tags.outputs.has_tags == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r tag; do
            PACKAGE="${tag%-v*}"
            VERSION="${tag##*-v}"

            NOTES=$(aft get-release-notes --package "$PACKAGE" --version "$VERSION" \
              | awk '/^Changelog:$/{f=1;next} f')
            [ -z "$NOTES" ] && NOTES="Release ${PACKAGE} v${VERSION}"

            echo "Creating GitHub release for: $tag"
            gh release create "$tag" \
              --title "${PACKAGE} v${VERSION}" \
              --notes "$NOTES" \
              --target main
          done < "$RUNNER_TEMP/new_tags.txt"

  stop-runner:
    name: Stop self-hosted EC2 runner
    needs:
      - start-runner
      - release
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.RELEASE_RUNNER_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.RELEASE_RUNNER_AWS_REGION }}

      - name: Terminate EC2 instance and deregister runner
        env:
          GH_TOKEN: ${{ secrets.RELEASE_RUNNER_GH_PERSONAL_ACCESS_TOKEN }}
          REPO: ${{ github.repository }}
          EC2_INSTANCE_ID: ${{ needs.start-runner.outputs.ec2-instance-id }}
          LABEL: ${{ needs.start-runner.outputs.label }}
        run: |
          set -euo pipefail

          # Terminate the EC2 instance
          if [ -n "$EC2_INSTANCE_ID" ]; then
            echo "Terminating EC2 instance: $EC2_INSTANCE_ID"
            aws ec2 terminate-instances --instance-ids "$EC2_INSTANCE_ID"
          else
            echo "No instance ID — skipping termination"
          fi

          # Deregister the runner from GitHub
          if [ -n "$LABEL" ]; then
            RUNNER_ID=$(curl -sf \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/runners" \
              | jq -r ".runners[] | select(.labels[]?.name == \"$LABEL\") | .id" || true)

            if [ -n "$RUNNER_ID" ] && [ "$RUNNER_ID" != "null" ]; then
              echo "Removing runner $RUNNER_ID (label: $LABEL)"
              curl -sf \
                -X DELETE \
                -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO}/actions/runners/${RUNNER_ID}"
            else
              echo "Runner with label $LABEL not found — may have already been removed"
            fi
          fi
