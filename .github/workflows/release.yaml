name: Release

on:
  push:
    branches: [main, feat/ci/release]
    paths:
      - '**/pubspec.yaml'

# IMPORTANT: Never cancel a release in progress. Queue subsequent runs.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

jobs:
  start-runner:
    name: Start self-hosted EC2 runner
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.RELEASE_RUNNER_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.RELEASE_RUNNER_AWS_REGION }}

      - name: Start EC2 runner
        id: start-ec2-runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: start
          github-token: ${{ secrets.RELEASE_RUNNER_GH_PERSONAL_ACCESS_TOKEN }}
          ec2-image-id: ami-07a00cf47dbbc844c
          ec2-instance-type: t3a.medium
          subnet-id: ${{ secrets.RELEASE_RUNNER_EC2_SUBNET_ID }}
          security-group-id: ${{ secrets.RELEASE_RUNNER_EC2_SECURITY_GROUP_ID }}
          ec2-volume-size: 50
          aws-resource-tags: >
            [
              {"Key": "Name", "Value": "github-actions-runner"},
              {"Key": "GitHubRepository", "Value": "${{ github.repository }}"},
              {"Key": "Purpose", "Value": "release"}
            ]
          run-runner-as-user: ubuntu
          pre-runner-script: |
            sudo apt-get update -y && \
            sudo apt-get install -y git libicu-dev curl xz-utils clang cmake ninja-build pkg-config libgtk-3-dev

  release:
    name: Release packages
    needs: start-runner
    runs-on: ${{ needs.start-runner.outputs.label }}
    steps:
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create publishing token (pub.dev)
        run: |
          set -eo pipefail
          PUB_TOKEN=$(curl --retry 5 --retry-connrefused -sLS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://pub.dev" -H "User-Agent: actions/oidc-client" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r '.value')
          echo "PUB_TOKEN=${PUB_TOKEN}" >> $GITHUB_ENV
          export PUB_TOKEN
          flutter pub token add https://pub.dev --env-var PUB_TOKEN

      - name: Install aft
        run: dart pub global activate -spath packages/aft

      - name: Check for new tags
        id: check-tags
        run: |
          aft publish --tags 2>&1 | tee "$RUNNER_TEMP/tags_output.txt"
          TAGS=$(grep "^New tag:" "$RUNNER_TEMP/tags_output.txt" | sed 's/^New tag: //' || true)
          if [ -z "$TAGS" ]; then
            echo "No new tags to create. Nothing to release."
            echo "has_tags=false" >> "$GITHUB_OUTPUT"
          else
            echo "New tags found:"
            echo "$TAGS"
            echo "has_tags=true" >> "$GITHUB_OUTPUT"
            echo "$TAGS" > "$RUNNER_TEMP/new_tags.txt"
          fi

      - name: Verify publish (pre-tag dry run)
        if: steps.check-tags.outputs.has_tags == 'true'
        run: aft publish --dry-run --force

      - name: Create and push tags
        if: steps.check-tags.outputs.has_tags == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          while IFS= read -r tag; do
            echo "Creating tag: $tag"
            git tag "$tag"
          done < "$RUNNER_TEMP/new_tags.txt"
          git push origin --tags

      - name: Verify publish (post-tag dry run)
        if: steps.check-tags.outputs.has_tags == 'true'
        run: aft publish --dry-run --force

      - name: Install GitHub CLI
        if: steps.check-tags.outputs.has_tags == 'true'
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update -y
          sudo apt-get install -y gh

      - name: Create GitHub releases
        if: steps.check-tags.outputs.has_tags == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r tag; do
            PACKAGE="${tag%-v*}"
            VERSION="${tag##*-v}"

            NOTES=$(aft get-release-notes --package "$PACKAGE" --version "$VERSION" \
              | awk '/^Changelog:$/{f=1;next} f')
            [ -z "$NOTES" ] && NOTES="Release ${PACKAGE} v${VERSION}"

            echo "Creating GitHub release for: $tag"
            gh release create "$tag" \
              --title "${PACKAGE} v${VERSION}" \
              --notes "$NOTES" \
              --target main
          done < "$RUNNER_TEMP/new_tags.txt"

  stop-runner:
    name: Stop self-hosted EC2 runner
    needs:
      - start-runner
      - release
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.RELEASE_RUNNER_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.RELEASE_RUNNER_AWS_REGION }}

      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: stop
          github-token: ${{ secrets.RELEASE_RUNNER_GH_PERSONAL_ACCESS_TOKEN }}
          label: ${{ needs.start-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-runner.outputs.ec2-instance-id }}
